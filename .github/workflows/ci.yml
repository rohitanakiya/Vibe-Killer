# Continuous integration for Vibe Killer.
#
# The suite's central claim is that every check is tested twice -- once against
# a fixture that has the weakness and once against one that does not -- and
# that the rule pack is *completely silent* on the patched fixtures. That claim
# is only worth anything if it is re-checked on every push, which is what this
# workflow is for.
#
# The dynamic job is the one that tests the claim rather than the code. Every
# other job proves a check against a stand-in: the rule pack against fixture
# source, the endpoint checks against httptest handlers written here to answer
# the way a vulnerable app is expected to answer. That job starts the fixture
# and points a real --target scan at it, so "reproduced against the running
# instance" is something a server did and not something this repository
# asserts about itself.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing here publishes, comments or writes to the repository, and
# a token that cannot write is the cheapest way to keep it that way.
permissions:
  contents: read

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Without this, the first OS to fail cancels the others and hides
      # whether the failure is platform-specific -- which is the single most
      # useful thing to know about a failure here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The Go floor lives in go.mod and is inherited from the
          # dependencies, so reading it from there keeps one source of truth.
          # Duplicating the version as a literal here means the two drift and
          # CI starts passing on a toolchain the module does not claim.
          go-version-file: go.mod
          check-latest: true

      # This step is the regression test for a real incident: a .gitignore
      # pattern without a leading slash matched rules/vibekiller/ as well as
      # the build output, so the rule pack was silently excluded from the
      # repository. Everything still worked locally, because the files were
      # right there on disk -- only a clone failed. `go:embed vibekiller/*.yaml`
      # is a *build-time* error when nothing matches, and CI builds from the
      # checkout rather than from a working tree, so this catches that class of
      # mistake at the only place it is visible.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Windows is in the matrix deliberately, not for completeness. Path
      # handling here is genuinely platform-dependent -- filepath.IsAbs treats
      # a POSIX-style "/repo/src/app.js" as relative on Windows because it
      # carries no drive letter -- and that has already produced one bug. The
      # scanners report paths in whatever form the wrapped tool emits, so the
      # normalizing code has to hold on all three.
      #
      # Semgrep is not installed in this job, so the rule-pack behaviour test
      # skips itself (see internal/checks/staticchecks/fixtures_test.go) and
      # the run stays quick. The rulepack job below is where it actually runs.
      #
      # The explicit timeout is above Go's 10-minute default per test binary:
      # the endpoint checks start in-process servers and take over a minute
      # locally, and a hosted runner is slower than a laptop.
      - name: Test
        run: go test -timeout 15m ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job gates, where the other three were trusted to from the start.
    # It was introduced advisory for one reason -- the race detector needs cgo
    # and a C toolchain, and the machine it was written on has neither
    # (CGO_ENABLED=0, no gcc), so it was the only job here never run before
    # being committed. It passed in 140s on its first run, which is the
    # baseline it was waiting for.
    #
    # Promoting it is safe in a way that is specific to this tool rather than
    # generally true of CI: the race detector reports races it actually
    # observed, so it does not go red without a real one. Its unreliability
    # runs the other way -- it can miss a race that is present -- and a false
    # negative costs a quiet pass, not a blocked push.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The checks run concurrently against in-process servers, and the engine
      # merges findings from several scanners into one report, so the
      # interesting races are in code this suite already exercises. Linux only:
      # -race needs cgo and a C toolchain, which is least fuss here, and a data
      # race is not usually platform-specific anyway.
      - name: Test with -race
        run: go test -race -timeout 25m ./...

  rulepack:
    name: rule pack (real semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned on purpose. The pack asserts both directions -- each rule fires
      # on its vulnerable fixture and the whole pack is silent on the patched
      # one -- and the silent half is sensitive to the engine, not just to the
      # rules. With a floating version, an upstream Semgrep change turns into a
      # red build on a commit that touched nothing, and the failure points at
      # the wrong thing. Bumping this is then a deliberate commit that can be
      # reviewed on its own.
      - name: Install semgrep
        run: pip install --disable-pip-version-check semgrep==1.185.0

      - name: Versions
        run: |
          semgrep --version
          go version

      # Only the packages that use semgrep. The rest already ran in the matrix
      # job, and this one is the slow half -- the fixture sweep drives the real
      # engine over two unrelated stacks and takes minutes rather than seconds.
      # -v so that a failure names the rule and fixture that disagreed, which
      # is the whole diagnostic value of this job.
      - name: Rule pack behaviour
        run: go test -v -timeout 40m ./internal/checks/staticchecks/... ./rules/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # gofmt -l exits 0 whether or not it found anything and just prints the
      # offending files, so the exit code has to be built by hand.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
          echo "gofmt clean"

      # Exits non-zero when go.mod or go.sum would change, which catches the
      # specific drift that bit this module once already: a dependency that is
      # imported directly but still marked // indirect.
      - name: go.mod is tidy
        run: go mod tidy -diff

  action:
    name: action (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No security-events here on purpose. The action can upload SARIF, but
    # this repository ships deliberately vulnerable fixtures, so uploading its
    # own results would fill the Security tab with alerts about code that is
    # meant to be exploitable. The upload step is exercised by being skipped
    # with upload-sarif: false; what this job proves is everything up to it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # install: skip exists for this. Without it the action would install the
      # last release, and a self-test would prove the action works against code
      # from before the change being tested -- which is the opposite of a test.
      - name: Build this tree and put it on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibekiller" ./cmd/vibekiller
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # No scanners, which keeps this to about a minute. Their coverage is
      # tested by the rulepack job; what is under test here is the action's own
      # plumbing -- inputs, outputs, the run directory it locates, the step
      # summary and the artifact.
      - name: Run the action against this repository
        id: vk
        uses: ./
        with:
          install: skip
          scanners: ""
          static-only: true
          upload-sarif: false
          fail-on-findings: false

      - name: The action produced what it promises
        run: |
          set -euo pipefail

          dir='${{ steps.vk.outputs.run-dir }}'
          sarif='${{ steps.vk.outputs.sarif-file }}'
          findings='${{ steps.vk.outputs.findings-file }}'
          code='${{ steps.vk.outputs.exit-code }}'

          echo "run-dir=$dir  exit-code=$code"
          for f in "$sarif" "$findings" "$dir/report.md"; do
            if [ ! -f "$f" ]; then
              echo "::error::the action promised $f and it does not exist"
              exit 1
            fi
          done

          # A SARIF file GitHub would reject is worse than none, so check the
          # properties it rejects on rather than merely that the file parses.
          python3 - "$sarif" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["version"] == "2.1.0", d["version"]
          assert d["$schema"].endswith("sarif-2.1.0.json"), d["$schema"]
          run = d["runs"][0]
          assert run["tool"]["driver"]["name"], "driver.name is required"
          assert "rules" in run["tool"]["driver"], "driver.rules is required"
          for i, res in enumerate(run["results"]):
              assert res["message"]["text"].strip(), f"results[{i}] has no message"
              loc = res["locations"][0]["physicalLocation"]
              uri = loc["artifactLocation"]["uri"]
              assert uri and not uri.startswith(("/", "file:")), f"results[{i}] uri {uri!r}"
              assert loc["region"]["startLine"] >= 1, f"results[{i}] startLine"
              assert loc["region"]["startColumn"] >= 1, f"results[{i}] startColumn"
              assert res["partialFingerprints"]["primaryLocationLineHash"], f"results[{i}] fingerprint"
          print(f"SARIF ok: {len(run['results'])} results, {len(run['tool']['driver']['rules'])} rules")
          PY

          # With no scanners installed, the checks that need them must report
          # as skipped rather than quietly contributing nothing. That is the
          # guarantee the whole coverage effort was about, asserted here
          # against the contract rather than against a report.
          python3 - "$findings" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          skipped = d.get("skipped") or []
          assert skipped, "nothing was recorded as skipped, though no scanner was installed"
          ids = {s["check_id"] for s in skipped}
          for want in ("engine.semgrep", "engine.osv-scanner", "engine.gitleaks"):
              assert want in ids, f"{want} is absent from the skip list: {sorted(ids)}"
          print(f"coverage ok: {len(skipped)} checks recorded as not run")
          PY

  dynamic:
    name: dynamic (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only like the rest. Nothing here reaches outside the runner: the
    # fixture binds 127.0.0.1, and 127.0.0.1:5000 is in the committed config's
    # authorized_targets, which is the list the scope guard enforces.
    permissions:
      contents: read
    # One leg per stack rather than one job running all three. The endpoint
    # checks are stack-agnostic by design -- they probe HTTP -- so what each
    # leg actually tests is a different adapter handing them routes, and a
    # failure should name the stack it belongs to. fail-fast off for the same
    # reason: if Express breaks, the FastAPI result is still worth having.
    strategy:
      fail-fast: false
      matrix:
        stack: [flask, express, fastapi]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # 3.12 rather than the newest, and the Flask fixture is the reason. Its
      # pins are deliberately old so the dependency check finds advisories for
      # them, and Werkzeug 2.0.1 calls ast.Str, which Python removed after
      # 3.12. The pins are the point of that fixture, so the interpreter moves
      # instead.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # These are the jobs that ask a real server. Everything else tests the
      # endpoint checks against httptest handlers written in Go -- which
      # proves the check against our own idea of the application and nothing
      # further. The Django extractor had exactly that shape of hole: the code
      # looked right, the tests agreed with it, and nothing had asked Django.
      #
      # Two runs per stack, and the second carries the weight. `confidence:
      # confirmed` is documented as reserved for a finding that was re-run
      # against the instance, so zero confirmed findings against corrected
      # code is the claim worth pinning -- while still allowing a heuristic
      # finding at `likely`, which the patched fixtures do produce for
      # endpoints that really are anonymous.
      - name: Reproduce against ${{ matrix.stack }}-vulnerable
        run: bash scripts/dynamic-check.sh ${{ matrix.stack }} vulnerable

      - name: Confirm nothing against ${{ matrix.stack }}-patched
        run: bash scripts/dynamic-check.sh ${{ matrix.stack }} patched

      # The runtime layer, on the one stack whose fixture has the agent's call
      # sites. It is the last layer that had never run against an application:
      # its two checks were tested against recorders, and the gate that decides
      # whether they may run asks whether an observation has arrived, which on
      # an idle instance it never had. So the layer was documented, shipped two
      # agents, and could not be reached.
      #
      # This installs the agent as an operator would, starts the app with
      # VIBEKILLER_SINK set, and requires both runtime checks to report. The
      # weaknesses they find are the two that only an observation can see: an
      # authorization decorator that is declared and never executes, and a
      # record read whose statement constrains no owner.
      - name: Observe ${{ matrix.stack }} at runtime
        if: matrix.stack == 'flask'
        run: bash scripts/dynamic-check.sh ${{ matrix.stack }} runtime
